            <label for="matricula">Matrícula</label>
            <input
              type="text"
              name="matricula"
              id="matricula"
              placeholder="2026-0015"
              required
            />
          </div>

          <div class="campo">
            <label for="nombres">Nombres</label>

              name="nombres"

              placeholder="A"
              required
